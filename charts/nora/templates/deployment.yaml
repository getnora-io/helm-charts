apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nora.fullname" . }}
  labels:
    {{- include "nora.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "nora.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "nora.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "nora.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          image: {{ include "nora.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.config.server.port | default 4000 }}
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: NORA_CONFIG_PATH
              value: /config/config.toml
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            {{- if .Values.existingSecret }}
            - name: secrets-config
              mountPath: /config/secrets
              readOnly: true
            {{- end }}
            {{- if .Values.config.auth.htpasswd.existingSecret }}
            - name: htpasswd
              mountPath: {{ .Values.config.auth.htpasswd.mountPath }}
              readOnly: true
            {{- end }}
            {{- if .Values.config.curation.blocklist.existingConfigMap }}
            - name: blocklist
              mountPath: {{ printf "%s/%s" .Values.config.curation.blocklist.mountPath (.Values.config.curation.blocklist.configMapKey | default "blocklist.json") }}
              subPath: {{ .Values.config.curation.blocklist.configMapKey | default "blocklist.json" }}
              readOnly: true
            {{- end }}
            {{- if .Values.config.curation.allowlist.existingConfigMap }}
            - name: allowlist
              mountPath: {{ printf "%s/%s" .Values.config.curation.allowlist.mountPath (.Values.config.curation.allowlist.configMapKey | default "allowlist.json") }}
              subPath: {{ .Values.config.curation.allowlist.configMapKey | default "allowlist.json" }}
              readOnly: true
            {{- end }}
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: {{ include "nora.fullname" . }}-config
        {{- if .Values.existingSecret }}
        - name: secrets-config
          secret:
            secretName: {{ .Values.existingSecret }}
        {{- end }}
        {{- if .Values.config.auth.htpasswd.existingSecret }}
        - name: htpasswd
          secret:
            secretName: {{ .Values.config.auth.htpasswd.existingSecret }}
            items:
              - key: {{ .Values.config.auth.htpasswd.secretKey }}
                path: {{ .Values.config.auth.htpasswd.secretKey }}
        {{- end }}
        {{- if .Values.config.curation.blocklist.existingConfigMap }}
        - name: blocklist
          configMap:
            name: {{ .Values.config.curation.blocklist.existingConfigMap }}
            items:
              - key: {{ .Values.config.curation.blocklist.configMapKey | default "blocklist.json" }}
                path: {{ .Values.config.curation.blocklist.configMapKey | default "blocklist.json" }}
        {{- end }}
        {{- if .Values.config.curation.allowlist.existingConfigMap }}
        - name: allowlist
          configMap:
            name: {{ .Values.config.curation.allowlist.existingConfigMap }}
            items:
              - key: {{ .Values.config.curation.allowlist.configMapKey | default "allowlist.json" }}
                path: {{ .Values.config.curation.allowlist.configMapKey | default "allowlist.json" }}
        {{- end }}
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "nora.fullname" . }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
